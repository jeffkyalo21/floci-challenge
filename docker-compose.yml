services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - FLOCI_DOCKER_FLAGS=--network=floci-challenge_default
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4566/_localstack/health || curl -sf http://127.0.0.1:4566/_floci/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  floci-dash:
    image: ghcr.io/ofsazib/floci-dash:latest
    container_name: floci-dash
    ports:
      - "9877:3000"
    environment:
      - FLOCI_URL=http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped
